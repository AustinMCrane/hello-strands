[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hello-strands"
version = "0.1.0"
description = "A Strands Agents scaffold using an OpenAI-compatible model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
hello-strands = "hello_strands.cli:main"
hello-strands-api = "hello_strands.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hello_strands"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
